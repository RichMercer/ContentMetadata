# Builds and packs every pull request to main and every push to main.
# A push to main publishes to nuget.org when the <Version> in the csproj
# isn't on nuget.org yet, so releasing means bumping the version in a PR.
# Publishing waits for approval in the protected "nuget" environment, uses
# NuGet Trusted Publishing (no long-lived API key in GitHub), then tags the
# commit v<version> and creates a GitHub release.
#
# One-time setup:
#   1. On nuget.org, open Trusted Publishing and add a policy for repository
#      RichMercer/ContentMetadata, workflow file nuget.yml, environment nuget.
#   2. In GitHub, create the "nuget" environment (Settings > Environments),
#      add yourself as a required reviewer, and limit deployment to the main
#      branch.
#   3. Add a repository secret NUGET_USER holding your nuget.org user name.
name: NuGet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: ContentMetadata/ContentMetadata.csproj
  PACKAGE_ID: telligentcontentmetadata

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          base=$(dotnet msbuild "$PROJECT" -getProperty:Version)
          if [[ ! "$base" =~ ^14\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::<Version> $base in $PROJECT is not a valid 14.x version."
            exit 1
          fi

          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$base"
            published=$(curl -fsS "https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID/index.json" | jq -r '.versions[]')
            if grep -qxiF "$version" <<< "$published"; then
              echo "::notice::$version is already on nuget.org; bump <Version> in $PROJECT to publish."
            else
              publish=true
            fi
          else
            version="$base-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "Package version: $version (publish: $publish)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build "$PROJECT" -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release --no-build -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write # tag and release
      id-token: write # required for NuGet Trusted Publishing
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg from the same folder.
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "package/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION" package/*.nupkg
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "v$VERSION"
          --generate-notes
          $([[ "$VERSION" == *-* ]] && echo --prerelease)
