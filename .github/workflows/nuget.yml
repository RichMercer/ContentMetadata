# Builds and packs on every push and pull request. Publishes to nuget.org only
# when a v14.x tag is pushed (for example v14.0.0 or v14.1.0-beta.1), using
# NuGet Trusted Publishing, so no long-lived API key is stored in GitHub.
#
# One-time setup:
#   1. On nuget.org, open Trusted Publishing and add a policy for repository
#      RichMercer/ContentMetadata, workflow file nuget.yml, environment nuget.
#   2. In GitHub, create the "nuget" environment (Settings > Environments),
#      add yourself as a required reviewer, and limit deployment to tags
#      matching v14.*.
#   3. Add a repository variable NUGET_USER holding your nuget.org user name.
name: NuGet

on:
  push:
    branches: [main, net10-v14]
    tags: ['v14.*']
  pull_request:
    branches: [main, net10-v14]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: ContentMetadata/ContentMetadata.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^14\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a valid 14.x version (expected v14.MINOR.PATCH[-prerelease])."
              exit 1
            fi
          else
            version="14.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "Package version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build "$PROJECT" -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release --no-build -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v14.')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg from the same folder.
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "package/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
